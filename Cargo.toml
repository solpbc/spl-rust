[workspace]
members = ["crates/spl-core", "crates/spl-transport", "crates/spl-home", "crates/spl-bridge"]
resolver = "3"

[workspace.package]
# Release identity is the git tag (currently v0.6.0), not this workspace
# version. Consumers pin by tag or rev. 0.1.0 is the crate graph label.
version = "0.1.0"
edition = "2024"
# The MSRV floor is the LOWEST consuming product's toolchain, not the newest
# available one. Raising it silently breaks a consumer's build.
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/solpbc/spl-rust"

[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Accessor-heavy wire APIs return values by design, so this lint is noise rather than signal.
must_use_candidate = "allow"
# Wire decoders deliberately narrow integers to their on-wire widths.
cast_possible_truncation = "allow"
# Wire code uses explicit casts to keep every on-wire width conversion visible.
cast_lossless = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
spl-core = { path = "crates/spl-core", version = "0.1.0" }
spl-home = { path = "crates/spl-home", version = "0.1.0" }
# Crypto/transport pins mirror the configuration the shipping Windows client
# already runs: the `ring` provider with default features off. This is a
# correctness-and-review-surface choice first (one audited provider across every
# consumer, no aws-lc-rs C toolchain in the graph); the smaller binary is a
# consequence, not the reason.
base64 = { version = "0.22", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["pkcs8"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.2"
hkdf = "0.12"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "pkcs8", "alloc"] }
ppp = "2.3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = ">=0.23.18", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
socket2 = { version = "0.6.5", default-features = false }
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "__rustls-tls"] }
tracing = "0.1"
webpki-roots = "1"

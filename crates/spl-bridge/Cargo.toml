[package]
name = "spl-bridge"
description = "SNI-passthrough MCP relay for the journal-MCP endpoint wire protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
jsonwebtoken = { workspace = true }
ppp = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spl-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt", "sync", "macros", "net", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true, features = ["x509-parser"] }
spl-home = { path = "../spl-home", version = "0.1.0" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "test-util", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
